<div class="mat-elevation-z8">
  <table mat-table [dataSource]="dataSource" matSort>
    <ng-container matColumnDef="idMovimientoDetalle">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
      <td mat-cell *matCellDef="let row"> {{row.idMovimientoDetalle}} </td>
    </ng-container>

    <ng-container matColumnDef="cantidad">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Cantidad </th>
      <td mat-cell *matCellDef="let row"> {{row.cantidad}} </td>
    </ng-container>

    <ng-container matColumnDef="idProducto">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Producto </th>
      <td mat-cell *matCellDef="let row">
        <div style="display: flex; align-items: center; gap: 8px">
          <img
            *ngIf="row.fkProducto?.foto"
            [src]="row.fkProducto.foto"
            alt="{{row.fkProducto?.nombre}}"
            width="40"
            height="40"
            style="object-fit: cover; border-radius: 4px"
          />
          <div>
            <div><strong>{{row.fkProducto?.nombre}}</strong></div>
            <div>
              <span *ngIf="row.fkProducto?.precioVenta">${{row.fkProducto.precioVenta}}</span>
            </div>
          </div>
        </div>
      </td>
    </ng-container>

    <ng-container matColumnDef="idMovimiento">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Movimiento </th>
      <td mat-cell *matCellDef="let row">
        <button mat-button color="primary" (click)="verMovimiento(row.fkMovimiento)"> Ver Movimiento </button>
      </td>
    </ng-container>

    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef> Acciones </th>
      <td mat-cell *matCellDef="let row">
        <button mat-icon-button color="primary" (click)="abrirFormulario(row)" matTooltip="Editar">
          <i class="ti ti-edit f-18"></i>
        </button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell" colspan="8">No hay datos que coincidan con "{{input.value}}"</td>
    </tr>
  </table>

  <mat-paginator [pageSizeOptions]="[5, 10, 25]" aria-label="Seleccionar página"></mat-paginator>
</div>
