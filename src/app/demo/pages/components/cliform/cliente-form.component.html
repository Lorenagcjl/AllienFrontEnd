<h2 mat-dialog-title>Nuevo Cliente</h2>

<mat-dialog-content> 
  <form [formGroup]="clienteForm" class="row">

    <div class="col-md-6">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Primer Nombre</mat-label>
        <input matInput formControlName="primerNombre">
      </mat-form-field>
    </div>

    <div class="col-md-6">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Segundo Nombre</mat-label>
        <input matInput formControlName="segundoNombre">
      </mat-form-field>
    </div>

    <div class="col-md-6">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Primer Apellido</mat-label>
        <input matInput formControlName="primerApellido">
      </mat-form-field>
    </div>

    <div class="col-md-6">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Segundo Apellido</mat-label>
        <input matInput formControlName="segundoApellido">
      </mat-form-field>
    </div>

    <div class="col-md-6">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Documento</mat-label>
        <input matInput formControlName="documento">
      </mat-form-field>
    </div>

    <div class="col-md-6">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Teléfono</mat-label>
        <input matInput formControlName="telefono">
      </mat-form-field>
    </div>

    <div class="col-12">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email">
      </mat-form-field>
    </div>

    <div class="col-12">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Dirección</mat-label>
        <input matInput formControlName="direccion">
      </mat-form-field>
    </div>

    <!-- mismo lugar donde tú tienes el mat-error -->
    <mat-error *ngIf="clienteForm.invalid">
      Complete los campos obligatorios correctamente
    </mat-error>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancelar</button>
  <button mat-raised-button
          color="primary"
          [disabled]="clienteForm.invalid"
          (click)="save()">
    Guardar
  </button>
</mat-dialog-actions>
