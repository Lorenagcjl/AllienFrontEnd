<h2 mat-dialog-title>Nuevo </h2>

<mat-dialog-content> 
  <form [formGroup]="mdsForm" class="row">

    <div class="col-md-6">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Id Movimiento Venta</mat-label>
        <input matInput formControlName="idMovimientoDetalle">
      </mat-form-field>
    </div>

    <div class="col-md-6">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Id Serial</mat-label>
        <input matInput formControlName="idProductoSerial">
      </mat-form-field>
    </div>

  
    <!-- mismo lugar donde tú tienes el mat-error -->
    <mat-error *ngIf="mdsForm.invalid">
      Complete los campos obligatorios correctamente
    </mat-error>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancelar</button>
  <button mat-raised-button
          color="primary"
          [disabled]="mdsForm.invalid"
          (click)="save()">
    Guardar
  </button>
</mat-dialog-actions>
