<div class="modal-manual-backdrop" (click)="onBackdropClick($event)">
  <div class="modal-manual-content shadow-lg">
    
    <div class="modal-header-custom">
      <h2 class="mat-headline-6 mb-0">
        <i class="ti ti-file-invoice me-2"></i>
        {{ ventaSeleccionada ? 'Editar Venta' : 'Registrar Nueva Venta' }}
      </h2>
      <button mat-icon-button (click)="onClose()" type="button" [disabled]="cargando">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <div class="modal-body-custom">
      <form [formGroup]="ventaForm" class="row">
        
        <div class="col-12 mb-3">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Seleccionar Cliente</mat-label>
            <mat-select formControlName="idCliente">
              <mat-option *ngFor="let c of clientes" [value]="c.idCliente">
                {{c.primerNombre}} {{c.primerApellido}} - {{c.cedula}}
              </mat-option>
            </mat-select>
            <mat-error *ngIf="ventaForm.get('idCliente')?.invalid">El cliente es obligatorio</mat-error>
          </mat-form-field>
        </div>

        <div class="col-12">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Observaciones</mat-label>
            <textarea matInput formControlName="observaciones" rows="4" placeholder="Detalles de la venta..."></textarea>
            <mat-error *ngIf="ventaForm.get('observaciones')?.invalid">Campo obligatorio</mat-error>
          </mat-form-field>
        </div>

      </form>
    </div>

    <div class="modal-actions-custom">
      <button mat-button type="button" (click)="onClose()" [disabled]="cargando">Cancelar</button>
      <button mat-raised-button color="primary" (click)="guardar()" [disabled]="ventaForm.invalid || cargando">
         <i class="ti ti-device-floppy me-1"></i> {{ cargando ? 'Guardando...' : (ventaSeleccionada ? 'Actualizar Venta' : 'Guardar Venta') }}
      </button>
    </div>

  </div>
</div>
