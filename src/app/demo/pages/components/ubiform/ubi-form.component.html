<h2 mat-dialog-title>Nueva Ubicacion</h2>
<mat-dialog-content>
  <form [formGroup]="ubiForm" class="row">

    <div class="col-md-6">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Descripcion</mat-label>
        <input matInput formControlName="descripcion">

      </mat-form-field>
    </div>


    <div class="col-md-6">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Nombre de Ubicacion</mat-label>
        <input matInput formControlName="nombre">
      </mat-form-field>
    </div>

    <div class="col-100">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Tipo de Ubicacion</mat-label>
        <input matInput formControlName="tipo">
      </mat-form-field>
    </div>



    <div class="col-md-6">

    </div>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancelar</button>
  <button mat-raised-button color="primary" [disabled]="ubiForm.invalid" (click)="save()">Guardar</button>
</mat-dialog-actions>
