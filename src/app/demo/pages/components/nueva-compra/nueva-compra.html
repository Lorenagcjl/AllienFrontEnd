<div class="container">
  <div class="page-header">
    <p class="page-subtitle">Módulo de Compras • Gestión de Inventario</p>
  </div>

  <div class="card">
    <div class="card-header">
      <h2>Nueva Compra</h2>
    </div>

    <div class="card-body">

      <!-- Información general -->
      <div class="form-section">
        <h3 class="form-section-title">Información General</h3>

        <div class="form-grid">
          <div class="form-group">
            <label>Fecha</label>
            <input type="text" [value]="fecha" readonly>
          </div>

          <div class="form-group">
            <label>Usuario</label>
            <input type="text" [value]="usuario" readonly>
          </div>

          <div class="form-group full-width">
            <label>Ubicación</label>
           <select [(ngModel)]="idUbicacionGlobal"
        (change)="cambiarUbicacionGlobal()">
  <option *ngFor="let u of ubicaciones"
          [ngValue]="u.idUbicacion">
    {{ u.nombre }}
  </option>
</select>

          </div>

          <div class="form-group full-width">
            <label>Observaciones</label>
            <textarea [(ngModel)]="observaciones"></textarea>
          </div>
        </div>
      </div>

      <!-- Productos -->
      <div class="form-section items-section">
        <h3 class="form-section-title">Productos a Ingresar</h3>

        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Producto</th>
                <th>Serial</th>
                <th>Cantidad</th>
                <th>Seriales</th>
                <th>Acciones</th>
              </tr>
            </thead>

            <tbody>
              <tr *ngFor="let item of items; let i = index">
                <td>
                  <select (change)="seleccionarProducto(item, productos[$event.target.selectedIndex - 1])">
                    <option value="">Seleccionar...</option>
                    <option *ngFor="let p of productos">{{ p.nombre }}</option>
                  </select>
                </td>

                <td>
                  <span class="badge" [class.badge-success]="item.esConSerial"
                        [class.badge-error]="!item.esConSerial">
                    {{ item.esConSerial ? 'SÍ' : 'NO' }}
                  </span>
                </td>

                <td>
                  <input type="number" [(ngModel)]="item.cantidad"
                         (change)="cambiarCantidad(item)" min="1">
                </td>

                <td>
                  <button *ngIf="item.esConSerial"
                          class="btn btn-primary btn-small"
                          (click)="abrirModalSeriales(item)">
                    Gestionar
                  </button>
                </td>

                <td>
                  <button class="btn btn-danger btn-small"
                          (click)="eliminarItem(i)">×</button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <button class="btn add-item-btn" (click)="agregarItem()">+ Agregar Producto</button>
      </div>

      <!-- Acciones -->
      <div class="form-actions">
        <button class="btn btn-outline" (click)="cancelar()">Cancelar</button>
        <button class="btn btn-success" (click)="guardarCompra()">Guardar Compra</button>
      </div>

    </div>
  </div>
</div>

<!-- Modal Seriales -->
<div class="modal" [class.show]="modalSerialVisible">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Seriales</h3>
      <button class="modal-close" (click)="cerrarModalSeriales()">×</button>
    </div>

    <div class="modal-body">
      <div class="serial-grid">
        <div *ngFor="let s of [].constructor(itemSerialActual?.cantidad); let i = index"
             class="serial-input-group">
          <label>Serial {{ i + 1 }}</label>
          <input type="text" [(ngModel)]="itemSerialActual.seriales[i]">
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn btn-outline" (click)="cerrarModalSeriales()">Cancelar</button>
      <button class="btn btn-primary" (click)="guardarSeriales()">Guardar</button>
    </div>
  </div>
</div>
