<mat-form-field appearance="outline" class="w-100">
  <mat-label>Buscar serial</mat-label>
  <input matInput (keyup)="applyFilter($event)" placeholder="Ej. ABC123" #input>
</mat-form-field>

<button mat-raised-button color="primary" (click)="abrirFormulario()">
  <i class="ti ti-plus"></i> Nuevo Serial
</button>

<div class="mat-elevation-z8">
  <table mat-table [dataSource]="dataSource" matSort>

    <ng-container matColumnDef="idProducto">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>ID Producto</th>
      <td mat-cell *matCellDef="let row">{{ row.idProducto }}</td>
    </ng-container>

    <ng-container matColumnDef="producto">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Producto</th>
      <td mat-cell *matCellDef="let row">{{ getNombreProducto(row.idProducto) }}</td>
    </ng-container>

    <ng-container matColumnDef="serial">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Serial</th>
      <td mat-cell *matCellDef="let row">{{ row.serial }}</td>
    </ng-container>

    <ng-container matColumnDef="estado">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Estado</th>
      <td mat-cell *matCellDef="let row">
        <span class="badge bg-light-primary text-primary">{{ row.estado }}</span>
      </td>
    </ng-container>

    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let row">
        <button mat-icon-button color="primary" (click)="editar(row)" matTooltip="Editar">
          <i class="ti ti-edit f-18"></i>
        </button>

        <button mat-icon-button color="warn" (click)="eliminar(row)" matTooltip="Eliminar">
          <i class="ti ti-trash f-18"></i>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell" colspan="4">No hay datos que coincidan con "{{input.value}}"</td>
    </tr>
  </table>

  <mat-paginator [pageSizeOptions]="[5, 10, 25]" aria-label="Seleccionar página"></mat-paginator>
</div>
