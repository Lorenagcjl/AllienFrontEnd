<div class="row align-items-center mb-3">
  <div class="col">
    <mat-form-field appearance="outline" class="w-100 hide-hint">
      <mat-label>Buscar serial</mat-label>
      <input matInput (keyup)="applyFilter($event)" placeholder="Ej. ABC123" #input [disabled]="cargando">
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>
  </div>
  
  <div class="col-auto">
    <button mat-raised-button color="primary" (click)="abrirFormulario()" [disabled]="cargando">
      <i class="ti ti-plus me-1"></i> Nuevo Serial
    </button>
  </div>
</div>

<div class="mat-elevation-z8 position-relative">
  @if (cargando) {
    <mat-progress-bar mode="indeterminate" class="position-absolute top-0 start-0 z-index-1"></mat-progress-bar>
  }

  <table mat-table [dataSource]="dataSource" matSort class="w-100" [class.loading-table]="cargando">

    <ng-container matColumnDef="idProducto">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>ID Prod.</th>
      <td mat-cell *matCellDef="let row">{{ row.idProducto }}</td>
    </ng-container>

    <ng-container matColumnDef="producto">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Producto</th>
      <td mat-cell *matCellDef="let row" class="fw-bold">{{ getNombreProducto(row.idProducto) }}</td>
    </ng-container>

    <ng-container matColumnDef="serial">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Número de Serial</th>
      <td mat-cell *matCellDef="let row" class="text-secondary">{{ row.serial }}</td>
    </ng-container>

    <ng-container matColumnDef="estado">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Estado</th>
      <td mat-cell *matCellDef="let row">
        <span class="badge bg-light-primary text-primary px-3">{{ row.estado }}</span>
      </td>
    </ng-container>

    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let row">
        <button mat-icon-button color="primary" (click)="editar(row)" [disabled]="cargando" matTooltip="Editar">
          <i class="ti ti-edit f-18"></i>
        </button>

        <button mat-icon-button color="warn" (click)="eliminar(row)" [disabled]="cargando" matTooltip="Eliminar">
          <i class="ti ti-trash f-18"></i>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell text-center py-4" colspan="5">
        No hay datos que coincidan con "{{ input.value }}"
      </td>
    </tr>
  </table>

  <mat-paginator [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons aria-label="Seleccionar página"></mat-paginator>
</div>

@if (modalOpen) {
  <app-producto-serial-modal 
    [open]="modalOpen" 
    [seleccionado]="serialSeleccionado" 
    (closed)="cerrarModal()"
    (saved)="onSaved()">
  </app-producto-serial-modal>
}
