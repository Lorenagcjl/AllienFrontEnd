<mat-form-field appearance="outline" class="w-100">
  <mat-label>Buscar ubicación</mat-label>
  <input matInput (keyup)="applyFilter($event)" placeholder="Ej. Bodega" #input>
</mat-form-field>

<button mat-raised-button color="primary" (click)="abrirFormulario()">
  <i class="ti ti-plus"></i> Nueva Ubicación
</button>

<div class="mat-elevation-z8">
  <table mat-table [dataSource]="dataSource" matSort>

    <ng-container matColumnDef="idUbicacion">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
      <td mat-cell *matCellDef="let row">{{ row.idUbicacion }}</td>
    </ng-container>

    <ng-container matColumnDef="nombre">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
      <td mat-cell *matCellDef="let row">{{ row.nombre }}</td>
    </ng-container>

    <ng-container matColumnDef="tipo">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Tipo</th>
      <td mat-cell *matCellDef="let row">{{ row.tipo }}</td>
    </ng-container>

    <ng-container matColumnDef="descripcion">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Descripción</th>
      <td mat-cell *matCellDef="let row">{{ row.descripcion }}</td>
    </ng-container>

    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let row">
        <button mat-icon-button color="primary" (click)="editar(row)" [disabled]="isEditing">
          <i class="ti ti-edit f-18"></i>
        </button>

        <button mat-icon-button color="warn" (click)="eliminar(row)">
          <i class="ti ti-trash f-18"></i>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell" colspan="5">
        No hay datos que coincidan con "{{ input.value }}"
      </td>
    </tr>
  </table>

  <mat-paginator [pageSizeOptions]="[5, 10, 25]" aria-label="Seleccionar página"></mat-paginator>
</div>

@if (modalOpen) {
<app-ubicacion-form-modal [ubicacion]="ubicacionSeleccionada" (closed)="cerrarModal()" (saved)="onSaved($event)">
</app-ubicacion-form-modal>
}
