<h2 mat-dialog-title>{{ movimientoForm.value.idMovimiento ? 'Editar Movimiento' : 'Nuevo Movimiento' }}</h2>
<form [formGroup]="movimientoForm" (ngSubmit)="save()" autocomplete="off">
  <mat-dialog-content>
    <div class="row">
      <div class="col-12 col-md-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Fecha Movimiento</mat-label>
          <input matInput [matDatepicker]="picker" formControlName="fechaMovimiento" required />
          <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
          <mat-datepicker #picker></mat-datepicker>
        </mat-form-field>
      </div>
      <div class="col-12 col-md-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Tipo</mat-label>
          <input matInput formControlName="tipo" required />
        </mat-form-field>
      </div>
      <div class="col-12">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Observaciones</mat-label>
          <textarea matInput formControlName="observaciones"></textarea>
        </mat-form-field>
      </div>
      <div class="col-12 col-md-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Ubicación Origen</mat-label>
          <mat-select formControlName="idUbicacionOrigen" required>
            <mat-option *ngFor="let ubicacion of ubicaciones" [value]="ubicacion.idUbicacion">
              {{ ubicacion.nombre }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>
      <div class="col-12 col-md-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Ubicación Destino</mat-label>
          <mat-select formControlName="idUbicacionDestino" required>
            <mat-option *ngFor="let ubicacion of ubicaciones" [value]="ubicacion.idUbicacion">
              {{ ubicacion.nombre }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>
      <div class="col-12">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Usuario</mat-label>
          <mat-select formControlName="idUsuario" required>
            <mat-option *ngFor="let usuario of usuarios" [value]="usuario.idUsuario">
              {{ usuario.primerNombre }} {{ usuario.primerApellido }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>
    </div>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>Cancelar</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="movimientoForm.invalid">Guardar</button>
  </mat-dialog-actions>
</form>
